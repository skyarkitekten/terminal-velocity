name: Infra CI

# Pull-request gate: format, validate, and plan the infra stack against both
# dev and prod. Plan-only — never applies from a PR. Each plan is posted as a
# sticky PR comment so reviewers see the diff inline, including the prod diff
# they are implicitly approving for promotion.
#
# The workflow runs on every PR so the required "Infra CI" check is always
# reported (a path-filtered trigger would leave non-infra PRs stuck on
# "Expected — Waiting for status to be reported"). Change detection gates the
# expensive plan jobs; the aggregate `infra-ci` job reports the required context
# whether or not infra files changed.

on:
    pull_request:

permissions:
    id-token: write
    contents: read
    pull-requests: write # sticky plan comment

concurrency:
    group: infra-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        name: Detect infra changes
        runs-on: ubuntu-latest
        outputs:
            infra: ${{ steps.filter.outputs.infra }}
        steps:
            - name: Filter paths
              id: filter
              uses: dorny/paths-filter@v3
              with:
                  filters: |
                      infra:
                        - 'infra/**'
                        - '.github/workflows/infra-ci.yml'
                        - '.github/workflows/terraform.yml'

    plan-dev:
        name: Plan (dev)
        needs: changes
        if: ${{ needs.changes.outputs.infra == 'true' }}
        uses: ./.github/workflows/terraform.yml
        with:
            environment: dev
            apply: false
            comment-on-pr: true
        secrets: inherit

    # Plans prod so reviewers see the promotion diff before approving the PR.
    # It targets the `prod` tfstate and tfvars but runs under the `prod-plan`
    # GitHub Environment: `prod` requires reviewers, which would stall the PR.
    plan-prod:
        name: Plan (prod)
        needs: changes
        if: ${{ needs.changes.outputs.infra == 'true' }}
        uses: ./.github/workflows/terraform.yml
        with:
            environment: prod
            github-environment: prod-plan
            apply: false
            comment-on-pr: true
        secrets: inherit

    # Aggregate gate that reports a stable "Infra CI" check-run context for branch
    # protection. It always runs: it passes when no infra files changed (nothing
    # to plan) and otherwise requires both plans to have succeeded.
    infra-ci:
        name: Infra CI
        needs: [changes, plan-dev, plan-prod]
        if: ${{ always() }}
        runs-on: ubuntu-latest
        steps:
            - name: Verify plan gate
              env:
                  CHANGED: ${{ needs.changes.outputs.infra }}
                  PLAN_DEV: ${{ needs.plan-dev.result }}
                  PLAN_PROD: ${{ needs.plan-prod.result }}
              run: |
                  echo "infra changed: $CHANGED"
                  echo "plan-dev result: $PLAN_DEV"
                  echo "plan-prod result: $PLAN_PROD"
                  if [ "$CHANGED" != "true" ]; then
                      echo "No infra changes in this PR; Infra CI gate passes without planning."
                      exit 0
                  fi
                  failed=0
                  for job in PLAN_DEV PLAN_PROD; do
                      result="${!job}"
                      if [ "$result" != "success" ]; then
                          echo "::error::Infra CI gate failed because $job did not succeed (result: $result)."
                          failed=1
                      fi
                  done
                  if [ "$failed" -eq 0 ]; then
                      echo "Infra changes planned successfully for dev and prod."
                  fi
                  exit "$failed"
