name: Infra CI

# Pull-request gate: format, validate, and plan the infra stack against dev and prod.
# Plan-only — never applies from a PR. Each environment's plan is the review artifact.
#
# The workflow runs on every PR so the required "Infra CI" check is always
# reported (a path-filtered trigger would leave non-infra PRs stuck on
# "Expected — Waiting for status to be reported"). Change detection gates the
# expensive plan job; the aggregate `infra-ci` job reports the required context
# whether or not infra files changed.

on:
    pull_request:

permissions:
    id-token: write
    contents: read
    pull-requests: read

concurrency:
    group: infra-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        name: Detect infra changes
        runs-on: ubuntu-latest
        outputs:
            infra: ${{ steps.filter.outputs.infra }}
        steps:
            - name: Filter paths
              id: filter
              uses: dorny/paths-filter@v3
              with:
                  filters: |
                      infra:
                        - 'infra/**'
                        - '.github/workflows/infra-ci.yml'
                        - '.github/workflows/terraform.yml'

    plan-dev:
        name: Plan (dev)
        needs: changes
        if: ${{ needs.changes.outputs.infra == 'true' }}
        permissions:
            id-token: write
            contents: read
            pull-requests: write
        uses: ./.github/workflows/terraform.yml
        with:
            environment: dev
            apply: false
            comment-on-pr: true
        secrets: inherit

    plan-prod:
        name: Plan (prod)
        needs: changes
        if: ${{ needs.changes.outputs.infra == 'true' }}
        permissions:
            id-token: write
            contents: read
            pull-requests: write
        uses: ./.github/workflows/terraform.yml
        with:
            environment: prod
            github-environment: prod-plan
            apply: false
            comment-on-pr: true
        secrets: inherit

    # Aggregate gate that reports a stable "Infra CI" check-run context for branch
    # protection. It always runs: it passes when no infra files changed (nothing
    # to plan) and otherwise requires the plan to have succeeded.
    infra-ci:
        name: Infra CI
        needs: [changes, plan-dev, plan-prod]
        if: ${{ always() }}
        runs-on: ubuntu-latest
        steps:
            - name: Verify plan gate
              run: |
                  changed="${{ needs.changes.outputs.infra }}"
                  dev_result="${{ needs.plan-dev.result }}"
                  prod_result="${{ needs.plan-prod.result }}"
                  echo "infra changed: $changed"
                  echo "plan-dev result: $dev_result"
                  echo "plan-prod result: $prod_result"
                  if [ "$changed" != "true" ]; then
                      echo "No infra changes in this PR; Infra CI gate passes without planning."
                      exit 0
                  fi
                  if [ "$dev_result" != "success" ] || [ "$prod_result" != "success" ]; then
                      echo "::error::Infra CI gate failed because a Terraform plan did not succeed."
                      exit 1
                  fi
                  echo "Infra changes planned successfully for dev and prod."
